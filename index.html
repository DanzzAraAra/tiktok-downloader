<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 680px; background: #1e293b; padding: 40px; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2); border: 1px solid #334155; }
        
        h1 { font-size: 28px; font-weight: 800; text-align: center; margin-bottom: 8px; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
        
        .input-box { display: flex; gap: 8px; background: #0f172a; padding: 8px; border-radius: 16px; border: 1px solid #334155; transition: all 0.3s ease; align-items: center; }
        .input-box:focus-within { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
        input { flex: 1; background: transparent; border: none; outline: none; color: #f8fafc; font-size: 15px; padding: 12px; width: 100%; }
        input::placeholder { color: #64748b; }
        
        .btn-icon { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; color: white; flex-shrink: 0; }
        .btn-paste { background: #334155; }
        .btn-paste:hover { background: #475569; }
        .btn-search { background: #6366f1; }
        .btn-search:hover { background: #4f46e5; }

        .progress-container { display: none; width: 100%; height: 4px; background: #334155; border-radius: 4px; margin-top: 24px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #818cf8); border-radius: 4px; transition: width 0.3s ease; }

        .result-container { display: none; margin-top: 32px; animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .profile-card { background: #0f172a; padding: 20px; border-radius: 16px; border: 1px solid #334155; margin-bottom: 24px; text-align: center; }
        .username { font-weight: 700; font-size: 18px; color: #f8fafc; margin-bottom: 4px; }
        .stats { font-size: 13px; color: #64748b; display: flex; justify-content: center; gap: 16px; }
        
        .video-wrapper { text-align: center; margin-bottom: 24px; }
        video { width: 100%; max-height: 360px; border-radius: 16px; background: #000; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .photo-card { background: #0f172a; border-radius: 16px; border: 1px solid #334155; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
        .photo-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; background: #1e293b; }
        
        .btn-download { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 12px; background: #334155; color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s ease; text-align: center; gap: 8px;}
        .btn-download:hover { background: #475569; }
        .btn-download:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; }
        
        .action-group { display: flex; flex-direction: column; gap: 12px; }
        .btn-primary-dl { background: #0284c7; }
        .btn-primary-dl:hover { background: #0369a1; }
        .btn-secondary-dl { background: #059669; }
        .btn-secondary-dl:hover { background: #047857; }

        .btn-spinner { width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, 0.2); border-left-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>TikTok Downloader</h1>
        <p class="subtitle">Download TikTok Videos, Audio, and Photos Instantly</p>

        <div class="input-box">
            <input type="text" id="targetUrl" placeholder="Paste TikTok link here...">
            
            <button class="btn-icon btn-paste" onclick="pasteFromClipboard()" title="Paste from clipboard">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </button>
            
            <button class="btn-icon btn-search" onclick="processUrl()" title="Download Media">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
            </button>
        </div>

        <div class="progress-container" id="mainLoader">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="result-container" id="resultView"></div>
    </div>

    <script>
        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('targetUrl').value = text;
            } catch (err) {
                alert('Failed to read clipboard. Please ensure clipboard permissions are allowed.');
            }
        }

        let progressInterval;

        function startProgress() {
            const loader = document.getElementById('mainLoader');
            const bar = document.getElementById('progressBar');
            loader.style.display = 'block';
            bar.style.width = '0%';
            
            let width = 0;
            progressInterval = setInterval(() => {
                if (width >= 85) {
                    clearInterval(progressInterval);
                } else {
                    width += Math.random() * 15;
                    if(width > 85) width = 85;
                    bar.style.width = width + '%';
                }
            }, 300);
        }

        function completeProgress() {
            clearInterval(progressInterval);
            const bar = document.getElementById('progressBar');
            bar.style.width = '100%';
            
            setTimeout(() => {
                document.getElementById('mainLoader').style.display = 'none';
                bar.style.width = '0%';
            }, 400);
        }

        function stopProgress() {
            clearInterval(progressInterval);
            document.getElementById('mainLoader').style.display = 'none';
            document.getElementById('progressBar').style.width = '0%';
        }

        async function processUrl() {
            const url = document.getElementById('targetUrl').value;
            const resultView = document.getElementById('resultView');

            if (!url) return alert('Please enter a valid link first');

            startProgress();
            resultView.style.display = 'none';
            resultView.innerHTML = '';

            try {
                let result;
                
                try {
                    const directApiUrl = `https://api.danzy.web.id/api/download/tiktok?url=${encodeURIComponent(url)}`;
                    const directResponse = await fetch(directApiUrl);
                    result = await directResponse.json();
                } catch (fallbackError) {
                    const proxyResponse = await fetch(`/api/fetch?url=${encodeURIComponent(url)}`);
                    result = await proxyResponse.json();
                }

                if (!result || !result.status || !result.data) {
                    throw new Error('Failed to fetch data or invalid response');
                }

                displayData(result.data);
                completeProgress();
            } catch (error) {
                stopProgress();
                alert('Access failed: The API server refused connection.');
            }
        }

        function displayData(data) {
            const resultView = document.getElementById('resultView');
            
            let template = `
                <div class="profile-card">
                    <div class="username">${data.username}</div>
                    <div class="stats">
                        <span>Views: ${data.views || 0}</span>
                        <span>Likes: ${data.likes || 0}</span>
                    </div>
                </div>
            `;

            if (data.type === 'video') {
                const streamUrl = data.downloads?.nowm?.[0];
                const audioUrl = data.mp3?.[0];
                
                template += `
                    <div class="video-wrapper">
                        <video src="${streamUrl}" controls preload="metadata"></video>
                    </div>
                    <div class="action-group">
                        <button class="btn-download btn-primary-dl" onclick="executeDownload('${streamUrl}', 'video', this)">Download Video</button>
                        <button class="btn-download btn-secondary-dl" onclick="executeDownload('${audioUrl}', 'mp3', this)">Download MP3</button>
                    </div>
                `;
            } else if (data.type === 'photo') {
                template += `<div class="photo-grid">`;
                
                const hdSlides = (data.slides || []).filter(item => item.url.includes('.jpeg'));
                const filteredSlides = Array.from(new Map(hdSlides.map(item => [item.index, item])).values());

                filteredSlides.forEach(slide => {
                    template += `
                        <div class="photo-card">
                            <img src="${slide.url}" alt="Preview">
                            <button class="btn-download" onclick="executeDownload('${slide.url}', 'photo', this)">Download Image</button>
                        </div>
                    `;
                });

                template += `</div>`;

                if (data.mp3 && data.mp3.length > 0) {
                    template += `
                        <div class="action-group">
                            <button class="btn-download btn-secondary-dl" onclick="executeDownload('${data.mp3[0]}', 'mp3', this)">Download MP3 Background</button>
                        </div>
                    `;
                }
            }

            resultView.innerHTML = template;
            resultView.style.display = 'block';
        }

        async function executeDownload(target, format, element) {
            if (!target || target === 'undefined') {
                return alert('Media URL not found');
            }

            const textBackup = element.innerText;
            element.disabled = true;
            element.innerHTML = `<span class="btn-spinner"></span>`;

            try {
                const response = await fetch(`/api/download?url=${encodeURIComponent(target)}&type=${format}`);
                if (!response.ok) throw new Error();
                
                const dataBlob = await response.blob();
                const localUrl = window.URL.createObjectURL(dataBlob);
                
                const downloader = document.createElement('a');
                downloader.href = localUrl;
                
                let fileExtension = '.mp4';
                if (format === 'mp3') fileExtension = '.mp3';
                if (format === 'photo') fileExtension = '.jpeg';
                
                downloader.download = `tiktok_media_${Date.now()}${fileExtension}`;
                document.body.appendChild(downloader);
                downloader.click();
                
                document.body.removeChild(downloader);
                window.URL.revokeObjectURL(localUrl);
            } catch (e) {
                alert('Download process failed, the file might be locked by the origin server');
            } finally {
                element.disabled = false;
                element.innerText = textBackup;
            }
        }
    </script>
</body>
</html>
