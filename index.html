<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #1e293b 0%, #0f172a 80%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e2e8f0;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 40px 36px;
            border-radius: 28px;
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(148, 163, 184, 0.12);
        }

        h1 {
            font-size: 30px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #a5b4fc, #67e8f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 36px;
            letter-spacing: -0.2px;
        }

        .input-box {
            display: flex;
            gap: 10px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            padding: 8px;
            border-radius: 20px;
            border: 1px solid rgba(100, 116, 139, 0.25);
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            align-items: center;
        }

        .input-box:focus-within {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f1f5f9;
            font-size: 15px;
            padding: 14px 16px;
            font-weight: 450;
            letter-spacing: 0.2px;
        }

        input::placeholder {
            color: #64748b;
            font-weight: 400;
        }

        .btn-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #fff;
            flex-shrink: 0;
        }

        .btn-paste {
            background: rgba(71, 85, 105, 0.6);
        }
        .btn-paste:hover {
            background: rgba(100, 116, 139, 0.8);
        }
        .btn-search {
            background: #6366f1;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
        }
        .btn-search:hover {
            background: #4f46e5;
            box-shadow: 0 6px 14px rgba(99, 102, 241, 0.4);
            transform: translateY(-1px);
        }

        .progress-container {
            display: none;
            width: 100%;
            height: 5px;
            background: rgba(51, 65, 85, 0.5);
            border-radius: 5px;
            margin-top: 28px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #67e8f9, #a78bfa);
            border-radius: 5px;
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .result-container {
            display: none;
            margin-top: 36px;
            animation: fadeSlide 0.45s ease forwards;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            padding: 22px 20px;
            border-radius: 18px;
            border: 1px solid rgba(148, 163, 184, 0.12);
            margin-bottom: 28px;
            text-align: center;
        }

        .username {
            font-weight: 650;
            font-size: 18px;
            color: #f8fafc;
            margin-bottom: 6px;
        }

        .stats {
            font-size: 13px;
            color: #94a3b8;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-weight: 450;
        }

        .video-wrapper {
            text-align: center;
            margin-bottom: 28px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        video {
            width: 100%;
            max-height: 380px;
            background: #000;
            display: block;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }

        .photo-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 18px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .photo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 22px rgba(0, 0, 0, 0.25);
        }

        .photo-card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 12px;
            background: #1e293b;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            gap: 8px;
            letter-spacing: -0.1px;
            color: #fff;
            background: rgba(71, 85, 105, 0.5);
        }

        .btn-download:hover {
            background: rgba(100, 116, 139, 0.75);
        }

        .btn-download:disabled {
            background: rgba(30, 41, 59, 0.7);
            color: #64748b;
            cursor: not-allowed;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn-primary-dl {
            background: #2563eb;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }
        .btn-primary-dl:hover {
            background: #1d4ed8;
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.4);
        }

        .btn-secondary-dl {
            background: #0d9488;
            box-shadow: 0 4px 10px rgba(13, 148, 136, 0.25);
        }
        .btn-secondary-dl:hover {
            background: #0f766e;
            box-shadow: 0 6px 14px rgba(13, 148, 136, 0.35);
        }

        .btn-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-left-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 28px 20px;
                border-radius: 24px;
            }
            h1 {
                font-size: 26px;
            }
            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TikTok Downloader</h1>
        <p class="subtitle">Download videos, audio, and photo slides in high quality</p>

        <div class="input-box">
            <input type="text" id="targetUrl" placeholder="Paste TikTok link here...">
            
            <button class="btn-icon btn-paste" onclick="pasteFromClipboard()" aria-label="Paste from clipboard">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </button>
            
            <button class="btn-icon btn-search" onclick="processUrl()" aria-label="Download media">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
            </button>
        </div>

        <div class="progress-container" id="mainLoader">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="result-container" id="resultView"></div>
    </div>

    <script>
        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('targetUrl').value = text;
            } catch (err) {
                alert('Unable to read clipboard. Please allow clipboard permissions.');
            }
        }

        let progressInterval;

        function startProgress() {
            const loader = document.getElementById('mainLoader');
            const bar = document.getElementById('progressBar');
            loader.style.display = 'block';
            bar.style.width = '0%';
            
            let width = 0;
            progressInterval = setInterval(() => {
                if (width >= 85) {
                    clearInterval(progressInterval);
                } else {
                    width += Math.random() * 18;
                    if(width > 85) width = 85;
                    bar.style.width = width + '%';
                }
            }, 280);
        }

        function completeProgress() {
            clearInterval(progressInterval);
            const bar = document.getElementById('progressBar');
            bar.style.width = '100%';
            setTimeout(() => {
                document.getElementById('mainLoader').style.display = 'none';
                bar.style.width = '0%';
            }, 400);
        }

        function stopProgress() {
            clearInterval(progressInterval);
            document.getElementById('mainLoader').style.display = 'none';
            document.getElementById('progressBar').style.width = '0%';
        }

        async function processUrl() {
            const url = document.getElementById('targetUrl').value;
            const resultView = document.getElementById('resultView');

            if (!url) return alert('Please enter a valid TikTok link');

            startProgress();
            resultView.style.display = 'none';
            resultView.innerHTML = '';

            try {
                let result;
                try {
                    const directApiUrl = `https://api.danzy.web.id/api/download/tiktok?url=${encodeURIComponent(url)}`;
                    const directResponse = await fetch(directApiUrl);
                    result = await directResponse.json();
                } catch (fallbackError) {
                    const proxyResponse = await fetch(`/api/fetch?url=${encodeURIComponent(url)}`);
                    result = await proxyResponse.json();
                }

                if (!result || !result.status || !result.data) {
                    throw new Error('Invalid data structure from API');
                }

                displayData(result.data);
                completeProgress();
            } catch (error) {
                stopProgress();
                alert('Fetch failed. The server may be unreachable or link invalid.');
            }
        }

        function displayData(data) {
            const resultView = document.getElementById('resultView');
            
            let template = `
                <div class="profile-card">
                    <div class="username">${data.username}</div>
                    <div class="stats">
                        <span>Views: ${data.views || 0}</span>
                        <span>Likes: ${data.likes || 0}</span>
                    </div>
                </div>
            `;

            if (data.type === 'video') {
                const streamUrl = data.downloads?.nowm?.[0];
                const audioUrl = data.mp3?.[0];
                
                template += `
                    <div class="video-wrapper">
                        <video src="${streamUrl}" controls preload="metadata"></video>
                    </div>
                    <div class="action-group">
                        <button class="btn-download btn-primary-dl" onclick="executeDownload('${streamUrl}', 'video', this)">Download Video</button>
                        <button class="btn-download btn-secondary-dl" onclick="executeDownload('${audioUrl}', 'mp3', this)">Download Audio (MP3)</button>
                    </div>
                `;
            } else if (data.type === 'photo') {
                template += `<div class="photo-grid">`;
                
                const hdSlides = (data.slides || []).filter(item => item.url.includes('.jpeg'));
                const filteredSlides = Array.from(new Map(hdSlides.map(item => [item.index, item])).values());

                filteredSlides.forEach(slide => {
                    template += `
                        <div class="photo-card">
                            <img src="${slide.url}" alt="Slide preview" loading="lazy">
                            <button class="btn-download" onclick="executeDownload('${slide.url}', 'photo', this)">Download Image</button>
                        </div>
                    `;
                });

                template += `</div>`;

                if (data.mp3 && data.mp3.length > 0) {
                    template += `
                        <div class="action-group">
                            <button class="btn-download btn-secondary-dl" onclick="executeDownload('${data.mp3[0]}', 'mp3', this)">Download Background Audio</button>
                        </div>
                    `;
                }
            }

            resultView.innerHTML = template;
            resultView.style.display = 'block';
        }

        async function executeDownload(target, format, element) {
            if (!target || target === 'undefined') {
                return alert('Media URL not available');
            }

            const originalText = element.innerText;
            element.disabled = true;
            element.innerHTML = `<span class="btn-spinner"></span>`;

            try {
                const response = await fetch(`/api/download?url=${encodeURIComponent(target)}&type=${format}`);
                if (!response.ok) throw new Error();
                
                const dataBlob = await response.blob();
                const localUrl = window.URL.createObjectURL(dataBlob);
                
                const downloader = document.createElement('a');
                downloader.href = localUrl;
                
                let fileExtension = '.mp4';
                if (format === 'mp3') fileExtension = '.mp3';
                if (format === 'photo') fileExtension = '.jpeg';
                
                downloader.download = `tiktok_media_${Date.now()}${fileExtension}`;
                document.body.appendChild(downloader);
                downloader.click();
                
                document.body.removeChild(downloader);
                window.URL.revokeObjectURL(localUrl);
            } catch (e) {
                alert('Download failed. The file might be blocked by the origin server.');
            } finally {
                element.disabled = false;
                element.innerText = originalText;
            }
        }
    </script>
</body>
</html>
